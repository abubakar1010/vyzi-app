name: vyzi
description: "VYZI"

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter
  # Italian (and English) copy for Flutter's own widgets: date pickers, the
  # text selection toolbar, tooltips — and the intl date symbols they load.
  flutter_localizations:
    sdk: flutter

  get:
  dio:
  flutter_screenutil:
  hive_flutter:
  connectivity_plus:
  path_provider:
  google_fonts:
  shared_preferences:
  flutter_secure_storage:
  flutter_svg:
  pin_code_fields:
  image_picker:
  camera:
  file_picker:
  flutter_html:
  intl:
  timeago:
  country_code_picker:
  flutter_launcher_icons:
  # google_mlkit_text_recognition: removed — OCR now handled server-side via OpenAI Vision API
  # syncfusion_flutter_pdf: removed — PDF text extraction no longer needed on-device
  # Renders contract PDFs through the OS: android.graphics.pdf.PdfRenderer on
  # Android, CGPDFPage on iOS. Nothing native ships with it. flutter_pdfview
  # was here before and bundled PDFium, which cost 5,876,784 bytes per ABI.
  pdfx: ^2.11.0
  flutter_cache_manager:
  url_launcher:
  share_plus:
  app_links: ^6.4.0

  # Firebase
  firebase_core:
  firebase_auth:
  firebase_messaging:
  flutter_local_notifications:

  # Social sign-in providers
  google_sign_in:
  sign_in_with_apple:
  crypto:
  pretty_dio_logger: ^1.4.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:
  flutter_launcher_icons:

flutter_launcher_icons:
    android: true
    ios: true
    remove_alpha_ios: true
    image_path: "assets/images/VYZI.png"

flutter:
  uses-material-design: true

  # Listed file by file on purpose. Registering `assets/icons/` and
  # `assets/images/` as directories shipped every file in them whether or not
  # any code named one -- that is how 70 unreferenced images came to be in the
  # APK. Adding a new asset now means adding a line here.
  assets:
    - assets/icons/1.webp
    - assets/icons/2.webp
    - assets/icons/3.webp
    - assets/icons/4.webp
    - assets/icons/5.webp
