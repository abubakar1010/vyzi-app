# Builds the iOS app on Codemagic's Macs and uploads it to TestFlight.
# Started by hand from the Codemagic dashboard (no automatic triggers).
#
# Needs, in Codemagic:
#   - Team settings > Integrations > Developer Portal: an App Store Connect
#     API key saved under the name "vyzi_asc_key".
#   - Team settings > Code signing identities: an Apple Distribution
#     certificate and an App Store provisioning profile for com.vyzi.
workflows:
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: vyzi_asc_key
    environment:
      # Pinned so a new Flutter release cannot change the build on its own.
      # Keep in step with .fvmrc, and bump both together on a tested branch.
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vyzi
      vars:
        # App Store Connect > the app > App Information > Apple ID (digits only).
        APP_STORE_APP_ID: "6822709799"
    scripts:
      - name: Check configuration
        script: |
          if [ "$APP_STORE_APP_ID" = "REPLACE_ME" ]; then
            echo "Set APP_STORE_APP_ID in codemagic.yaml to the app's Apple ID."
            exit 1
          fi
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: cd ios && pod install --repo-update
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          # Every upload needs a build number higher than the last one.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Internal testers get the build without Beta App Review;
        # submitting it would need the external-testing details filled in.
        submit_to_testflight: false
